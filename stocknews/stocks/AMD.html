<style>:root{--bg:#F6F7F9;--bg2:#FFFFFF;--card:rgba(255,255,255,.86);--fg:#0B1324;--muted:#5B6472;--line:rgba(11,19,36,.12);

*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg));color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
min-height:100%;overflow-x:hidden;transition:background-color .6s,color .6s}
.top{position:relative;z-index:2;display:flex;align-items:center;gap:22px;padding:14px max(20px,env(safe-area-inset-left)) 12px}
.top img{height:40px;width:auto}
.tag{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg)}
.clocks{margin-left:auto;display:flex;gap:18px;font-size:11.5px;color:var(--muted);text-align:right;line-height:1.3}
.clocks b{display:block;color:var(--fg);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.rule{height:3px;background:linear-gradient(90deg,#FFC000 0%,#FF9F1A 28%,#FF8040 48%,#FF5F5F 68%,#FF3B6E 84%,#FF2F8A 100%)}
.logo-dark{display:none}:root[data-theme="dark"] .logo-dark{display:block}:root[data-theme="dark"] .logo-light{display:none}
.scene{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.scene::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:radial-gradient(70% 100% at 50% 100%,color-mix(in srgb,var(--globe) 16%,transparent),transparent)}
main{position:relative;z-index:1;display:grid;justify-items:center;align-content:center;min-height:calc(100vh - 90px);min-height:calc(100dvh - 90px);gap:18px;padding:28px max(16px,env(safe-area-inset-left)) 32px max(16px,env(safe-area-inset-right))}
h1{margin:0;font-family:Newsreader,Georgia,serif;font-size:clamp(34px,5.2vw,58px);line-height:1.05;text-align:center;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:-6px 0 4px;color:var(--fg);opacity:.8;font-size:clamp(13px,1.6vw,16px);text-align:center}
.card{width:min(440px,100%);background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;
padding:26px 28px 22px;display:grid;gap:12px;box-shadow:0 18px 50px rgba(6,16,31,.14)}
:root[data-theme="dark"] .card{box-shadow:0 0 0 1px rgba(61,123,217,.18),0 18px 60px rgba(0,0,0,.45)}
.lock{justify-self:center;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#3B6FD8;
background:color-mix(in srgb,#3B6FD8 12%,transparent);border:1px solid color-mix(in srgb,#3B6FD8 22%,transparent)}
:root[data-theme="dark"] .lock{color:#DCE6F5;background:rgba(238,242,247,.06);border-color:var(--line)}
h2{margin:2px 0 0;font-size:21px;font-weight:700;text-align:center}
p{margin:0;color:var(--muted);font-size:13.5px;text-align:center}
form{display:grid;gap:12px;margin-top:6px}
label.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.field{position:relative;display:flex;align-items:center}
.field .ki{position:absolute;left:14px;color:var(--muted);display:grid}
.field input{font:inherit;font-size:16px;padding:12px 46px 12px 42px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--fg);width:100%}
.eye{position:absolute;right:6px;width:36px;height:36px;border:0;border-radius:9px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.eye .eye-on{display:none}.eye[aria-pressed=true] .eye-on{display:block}.eye[aria-pressed=true] .eye-off{display:none}
input:focus-visible,button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.rem{display:flex;gap:9px;align-items:center;font-size:13.5px;font-weight:600;color:var(--fg)}
.rem input{width:18px;height:18px;accent-color:#2F6BDB;margin:0}
.go{font:inherit;font-weight:700;font-size:16px;padding:13px 14px;border-radius:12px;border:0;background:var(--btn);color:var(--btn-fg);cursor:pointer;
display:flex;align-items:center;justify-content:center;gap:8px}
.go[disabled]{opacity:.6;cursor:progress}
.err{min-height:1.2em;color:var(--err);font-size:13px;font-weight:600;text-align:center}
@media (max-width:700px){.tag{display:none}.clocks{gap:12px;font-size:10.5px}.clocks b{font-size:12px}
  main{padding-top:20px;gap:14px}.card{padding:22px 18px 18px}.sub{font-size:12.5px}}

.scene::after{height:30%;background:linear-gradient(0deg,var(--glow),transparent)}
.rule{height:3px;background:var(--grad)}
.hbar{width:96px;height:4px;border-radius:4px;background:var(--grad);margin-top:-6px}

.card{position:relative;border:1px solid transparent;

.card::before{content:"";position:absolute;left:26px;right:26px;top:-1px;height:3px;border-radius:0 0 3px 3px;background:var(--grad)}

:root[data-theme="dark"] .lock{color:#1A0E05;background:var(--grad-d);border:0}
h2{font-size:22px;letter-spacing:-.01em}
.field input:focus{border-color:#FF8040}
.rem input{accent-color:#FF8040}
.go{background:var(--grad-d);color:#1A0E05;font-weight:800;box-shadow:0 10px 24px rgba(255,95,95,.28);transition:filter .2s,transform .2s,box-shadow .2s}
.go:hover{filter:brightness(1.05) saturate(1.05);box-shadow:0 12px 30px rgba(255,95,95,.36)}
.go:active{transform:translateY(1px)}
.foot{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

<script>(function(){var box=JSON.parse(document.getElementById('sn-box').textContent);
var f=document.getElementById('sn-form'),pw=document.getElementById('sn-pw'),rem=document.getElementById('sn-rem'),
btn=f.querySelector('.go'),label=btn.querySelector('span'),err=document.getElementById('sn-err'),eye=document.getElementById('sn-eye');
eye.addEventListener('click',function(){var on=eye.getAttribute('aria-pressed')!=='true';eye.setAttribute('aria-pressed',on);
pw.type=on?'text':'password';eye.setAttribute('aria-label',on?'Hide password':'Show password');pw.focus()});
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function enc(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
var C=window.crypto&&crypto.subtle;
async function bitsFrom(p,salt){var k=await C.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);
return new Uint8Array(await C.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(salt),iterations:box.it},k,512))}
async function dec(bits,o){var n=b64(o.nonce),ct=b64(o.ct),tag=b64(o.tag);
var mk=await C.importKey('raw',bits.slice(32),{name:'HMAC',hash:'SHA-256'},false,['verify']);
var m=new Uint8Array(n.length+ct.length);m.set(n);m.set(ct,n.length);
if(!await C.verify('HMAC',mk,tag,m))throw new Error('bad');
var ek=await C.importKey('raw',bits.slice(0,32),'AES-CTR',false,['decrypt']);
var cb=new Uint8Array(16);cb.set(n);
return new Uint8Array(await C.decrypt({name:'AES-CTR',counter:cb,length:64},ek,ct))}
// the page is sealed with a content key; box.keys holds that key sealed under this week's and last week's password key
async function openWith(bits,salt){var w=(box.keys||[]).filter(function(k){return k.salt===salt})[0];if(!w)throw new Error('bad');
return new TextDecoder().decode(await dec(await dec(bits,w),box))}
function show(html){document.open();document.write(html);document.close()}
// document.open() is ignored while the gate page is still loading, so wait for load first
function showReady(html){if(document.readyState==='complete')show(html);else window.addEventListener('load',function(){setTimeout(function(){show(html)},0)})}
var KEEP=+document.getElementById('sn-form').dataset.keep||7*864e5,P='sn-key:';
function mine(n){return (box.keys||[]).some(function(k){return P+k.salt===n})}
// a remembered device keeps {v: password key, t: time of unlock} for the remember time (7 days; 2 hours in the 9 Nov test); without the tick, only the tab session keeps it
function saved(){var out=[];try{(box.keys||[]).forEach(function(k){var n=P+k.salt,v=sessionStorage.getItem(n);if(v)out.push({salt:k.salt,v:v});
var r=JSON.parse(localStorage.getItem(n)||'null');if(r&&r.v&&Date.now()-r.t>=0&&Date.now()-r.t<KEEP)out.push({salt:k.salt,v:r.v});else if(r)localStorage.removeItem(n)})}catch(e){}return out}
function tidy(){try{[sessionStorage,localStorage].forEach(function(st){for(var i=st.length-1;i>=0;i--){var n=st.key(i);if(n&&n.indexOf(P)===0&&!mine(n))st.removeItem(n)}})}catch(e){}}
function keep(bits,salt,long){var n=P+salt,v=enc(bits);tidy();try{sessionStorage.setItem(n,v)}catch(e){}
try{if(long)localStorage.setItem(n,JSON.stringify({v:v,t:Date.now()}));else localStorage.removeItem(n)}catch(e){}}
function forget(salt){try{sessionStorage.removeItem(P+salt);localStorage.removeItem(P+salt)}catch(e){}}
if(!C){err.textContent='This browser cannot unlock the page. Use a current Chrome, Edge, Safari or Firefox.';btn.disabled=true;return}
var s=saved();if(s.length){document.body.style.visibility='hidden';
(function next(i){if(i>=s.length){document.body.style.visibility='';return}
openWith(b64(s[i].v),s[i].salt).then(showReady).catch(function(){forget(s[i].salt);next(i+1)})})(0)}
f.addEventListener('submit',async function(e){e.preventDefault();err.textContent='';btn.disabled=true;label.textContent='Unlocking…';
try{var salt=box.keys[0].salt,bits=await bitsFrom(pw.value,salt);var html=await openWith(bits,salt);keep(bits,salt,rem.checked);show(html)}
catch(x){err.textContent='That password did not work. Try again.';btn.disabled=false;label.textContent='Unlock';pw.select()}})})();</script></body></html>
