<script>(function(){var box=JSON.parse(document.getElementById('sn-box').textContent);
var f=document.getElementById('sn-form'),pw=document.getElementById('sn-pw'),rem=document.getElementById('sn-rem'),
btn=f.querySelector('.go'),label=btn.querySelector('span'),err=document.getElementById('sn-err'),eye=document.getElementById('sn-eye');
eye.addEventListener('click',function(){var on=eye.getAttribute('aria-pressed')!=='true';eye.setAttribute('aria-pressed',on);
pw.type=on?'text':'password';eye.setAttribute('aria-label',on?'Hide password':'Show password');pw.focus()});
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function enc(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
var C=window.crypto&&crypto.subtle;
async function bitsFrom(p,salt){var k=await C.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);
return new Uint8Array(await C.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(salt),iterations:box.it},k,512))}
async function dec(bits,o){var n=b64(o.nonce),ct=b64(o.ct),tag=b64(o.tag);
var mk=await C.importKey('raw',bits.slice(32),{name:'HMAC',hash:'SHA-256'},false,['verify']);
var m=new Uint8Array(n.length+ct.length);m.set(n);m.set(ct,n.length);
if(!await C.verify('HMAC',mk,tag,m))throw new Error('bad');
var ek=await C.importKey('raw',bits.slice(0,32),'AES-CTR',false,['decrypt']);
var cb=new Uint8Array(16);cb.set(n);
return new Uint8Array(await C.decrypt({name:'AES-CTR',counter:cb,length:64},ek,ct))}
// the page is sealed with a content key; box.keys holds that key sealed under this week's and last week's password key
async function openWith(bits,salt){var w=(box.keys||[]).filter(function(k){return k.salt===salt})[0];if(!w)throw new Error('bad');
return new TextDecoder().decode(await dec(await dec(bits,w),box))}
function show(html){document.open();document.write(html);document.close()}
// document.open() is ignored while the gate page is still loading, so wait for load first
function showReady(html){if(document.readyState==='complete')show(html);else window.addEventListener('load',function(){setTimeout(function(){show(html)},0)})}
var KEEP=+document.getElementById('sn-form').dataset.keep||7*864e5,P='sn-key:';
function mine(n){return (box.keys||[]).some(function(k){return P+k.salt===n})}
// a remembered device keeps {v: password key, t: time of unlock} for the remember time (7 days; 2 hours in the 9 Nov test); without the tick, only the tab session keeps it
function saved(){var out=[];try{(box.keys||[]).forEach(function(k){var n=P+k.salt,v=sessionStorage.getItem(n);if(v)out.push({salt:k.salt,v:v});
var r=JSON.parse(localStorage.getItem(n)||'null');if(r&&r.v&&Date.now()-r.t>=0&&Date.now()-r.t<KEEP)out.push({salt:k.salt,v:r.v});else if(r)localStorage.removeItem(n)})}catch(e){}return out}
function tidy(){try{[sessionStorage,localStorage].forEach(function(st){for(var i=st.length-1;i>=0;i--){var n=st.key(i);if(n&&n.indexOf(P)===0&&!mine(n))st.removeItem(n)}})}catch(e){}}
function keep(bits,salt,long){var n=P+salt,v=enc(bits);tidy();try{sessionStorage.setItem(n,v)}catch(e){}
try{if(long)localStorage.setItem(n,JSON.stringify({v:v,t:Date.now()}));else localStorage.removeItem(n)}catch(e){}}
function forget(salt){try{sessionStorage.removeItem(P+salt);localStorage.removeItem(P+salt)}catch(e){}}
if(!C){err.textContent='This browser cannot unlock the page. Use a current Chrome, Edge, Safari or Firefox.';btn.disabled=true;return}
var s=saved();if(s.length){document.body.style.visibility='hidden';
(function next(i){if(i>=s.length){document.body.style.visibility='';document.documentElement.classList.remove('sn-auto');document.documentElement.style.background='';return}
openWith(b64(s[i].v),s[i].salt).then(showReady).catch(function(){forget(s[i].salt);next(i+1)})})(0)}
f.addEventListener('submit',async function(e){e.preventDefault();err.textContent='';btn.disabled=true;label.textContent='Unlocking…';
try{var salt=box.keys[0].salt,bits=await bitsFrom(pw.value,salt);var html=await openWith(bits,salt);keep(bits,salt,rem.checked);show(html)}
catch(x){err.textContent='That password did not work. Try again.';btn.disabled=false;label.textContent='Unlock';pw.select()}})})();</script></body></html>
